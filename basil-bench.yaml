# =============================================================================
# BENCH ONLY - sensors, no relays, no pump, no WiFi.
# Purpose: prove the three sensors work and read off the calibration numbers.
#
# Wire ONLY this, powered from USB:
#   HW-390 soil   VCC -> 3V3   GND -> G    AOUT -> A0
#   SSD1306 OLED  VCC -> 3V3   GND -> G    SCL -> D1   SDA -> D2
#   HC-SR04       VCC -> VU(5V) GND -> G   TRIG -> D4
#                 ECHO --[1k]--+-- D5
#                              |
#                            [2k]
#                              |
#                             GND        <- ECHO is 5V, D5 is not 5V tolerant
#
#   esphome run basil-bench.yaml --device COM15
#     (COM14 is a different ESP32 - do not touch it)
#
# WHAT TO WRITE DOWN
#   1. soil_v with the probe dry in air        -> ____ V
#   2. soil_v with the probe in water to the   -> ____ V
#      max line (do NOT submerge the board)
#   3. tank_dist with the tub EMPTY, sensor    -> ____ cm
#      mounted where it will live              = tank_empty_cm
#   4. tank_dist with the tub at working full  -> ____ cm
#      (tank_empty_cm minus this = tank_full_cm)
#   5. pump_min_cm - see PUMP PULSE below
#
# ALREADY MEASURED 2026-09-18
#   soil_v dry in air        0.767
#   tank_dist empty tub     23.8  (tape says the tub is 22.5 deep; the
#                                  1.3 difference is lid + standoff)
#   cross-section            130 cm2, i.e. 480ml moved it 3.7cm
#   tank_dist working level  7.0  -> 16.8cm of water, ~2.3L
#
# MANUAL PUMP - hold the board's FLASH button
#   FLASH is wired to GPIO0, and the bench build does not use the light
#   relay, so the button is free. Hold it to run the pump, release to stop.
#   Do NOT hold it while the board boots - that is flash mode.
#
#   Two things to do with it:
#     a) Watch the tray fill. Hold until the tray is at the level you want,
#        release, and note how far tank_dist moved. That drop IS the dose:
#        Dose = 23.8 - (dist at release) ... minus the depth you started
#        from. The full firmware's Calibrate buttons do this for you later.
#     b) Find pump_min_cm. Run the outlet into a bucket and hold in short
#        bursts, watching the log. Smooth flow means keep going; gurgling
#        or spitting means the inlet is drawing air. Note the last good
#        distance D:  pump_min_cm = (23.8 - D) + 1
#
#   Safety in firmware: the pump stops on its own after 45s, and stops
#   immediately if the water gets below 3cm, button held or not.
#
#   Wire for it: relay VCC -> 3V3, JD-VCC -> 5V, IN2 -> D6.
#
# OTA AND WEB UI
#   Fill wifi_ssid / wifi_password in secrets.yaml, then flash ONCE over
#   USB. OTA cannot bootstrap itself - the firmware on the board right now
#   has no wifi, so this one serial flash is unavoidable:
#       esphome run basil-bench.yaml --device COM15      (never COM14)
#   After that:
#       esphome run basil-bench.yaml                     (finds it by mDNS)
#   The web UI at http://basil-bench.local carries a Pump toggle and live
#   readings, which beats crouching over the FLASH button while watching
#   the tray. The button still works.
# =============================================================================

esphome:
  name: basil-bench

esp8266:
  board: nodemcuv2

logger:
  level: INFO
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Basil Bench Fallback"
    password: !secret fallback_password

captive_portal:

# No OTA password on purpose: the user loses access to the source tree
# often enough that being locked out of OTA is the likelier failure than
# someone on the LAN pushing firmware. Recovery without it means opening
# the box and flashing over USB.
ota:
  - platform: esphome

# v2 with local assets - see the note in basil.yaml. v1 truncates its
# single-response entity table on an ESP8266.
web_server:
  port: 80
  version: 2
  local: true

i2c:
  sda: GPIO4      # D2
  scl: GPIO5      # D1
  frequency: 400kHz
  scan: true      # prints every I2C address found, so a dead OLED is obvious

sensor:
  - platform: adc
    pin: A0
    id: soil_v
    name: "soil_v"
    update_interval: 2s
    accuracy_decimals: 3
    unit_of_measurement: V
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
    on_value:
      then:
        - lambda: 'ESP_LOGI("cal", "soil_v = %.3f V", x);'

  - platform: dht
    pin: GPIO13
    model: DHT11
    update_interval: 10s
    temperature:
      name: "box_temp"
      id: box_temp
      on_value:
        then:
          - lambda: 'ESP_LOGI("cal", "box_temp = %.1f C", x);'
    humidity:
      name: "box_rh"
      id: box_rh
      on_value:
        then:
          - lambda: 'ESP_LOGI("cal", "box_rh = %.0f %%", x);'

  - platform: ultrasonic
    trigger_pin: GPIO2    # D4
    echo_pin: GPIO14      # D5 (through the divider)
    id: tank_dist
    name: "tank_dist"
    update_interval: 2s
    timeout: 2.0m
    unit_of_measurement: cm
    accuracy_decimals: 1
    filters:
      - multiply: 100     # ESPHome reports metres
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("cal", "tank_dist = %.1f cm  depth %.1f  pump %s",
                     x, 23.8f - x, id(pump).state ? "ON" : "off");

font:
  - file: "gfonts://Roboto"
    id: f_s
    size: 12
  - file: "gfonts://Roboto"
    id: f_m
    size: 20

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.print(0, 0, id(f_s), "BENCH");
      it.line(0, 14, 128, 14);

      it.print(0, 18, id(f_s), "soil");
      if (id(soil_v).has_state())
        it.printf(128, 16, id(f_m), TextAlign::TOP_RIGHT, "%.3f V",
                  id(soil_v).state);
      else
        it.print(128, 16, id(f_m), TextAlign::TOP_RIGHT, "--");

      it.print(0, 42, id(f_s), "dist");
      if (id(tank_dist).has_state())
        it.printf(128, 40, id(f_m), TextAlign::TOP_RIGHT, "%.1f cm",
                  id(tank_dist).state);
      else
        it.print(128, 40, id(f_m), TextAlign::TOP_RIGHT, "--");

# -------------------------------------------------------------- manual pump
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0       # the onboard FLASH button
      mode:
        input: true
        pullup: true
      inverted: true
    id: flash_btn
    internal: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - logger.log:
          format: "FLASH held - pump ON"
          level: INFO
      - switch.turn_on: pump
    on_release:
      - switch.turn_off: pump
      - delay: 2s
      - component.update: tank_dist
      - delay: 1s
      - lambda: |-
          ESP_LOGI("cal", "pump OFF, dist = %.1f cm -> depth %.1f cm",
                   id(tank_dist).state, 23.8f - id(tank_dist).state);

switch:
  - platform: gpio
    pin:
      number: GPIO12      # D6 -> relay IN2, active low
      inverted: true
    id: pump
    name: "Pump"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 45s        # watchdog, independent of the button
      - switch.turn_off: pump
      - logger.log:
          format: "pump watchdog fired"
          level: INFO
    on_turn_off:
      - logger.log:
          format: "pump OFF"
          level: INFO

interval:
  # Hard floor: never let the tank go below 3cm of water, button or not.
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - switch.is_on: pump
              - lambda: 'return id(tank_dist).has_state();'
              - lambda: 'return id(tank_dist).state >= 20.8f;'
          then:
            - switch.turn_off: pump
            - logger.log:
                format: "FLOOR - under 3cm of water, pump cut"
                level: INFO
